name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag/ref to build & publish (e.g. v0.3.0). Empty = triggering ref."
        required: false
        default: ""

jobs:
  # テストは python-ci.yml が main/PR で用途別ジョブ（unit / e2e / meta-harness
  # on macOS+srt / docker）としてゲート済み。タグは green な main から切るため、
  # publish 側で全パッケージを再テストせず、ビルド＋公開のみ行う。
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

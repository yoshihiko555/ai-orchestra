name: Python CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Check context templates
        run: python scripts/orchestra-manager.py context check

      - name: Run unit tests
        run: pytest tests/unit/ --cov=packages --cov=scripts --cov-report=term-missing

  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run E2E tests
        env:
          AI_ORCHESTRA_DIR: ${{ github.workspace }}
        run: pytest tests/e2e/ -v

  meta-harness-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          npm install -g @anthropic-ai/sandbox-runtime
          srt --version

      - name: Run meta-harness tests
        env:
          AI_ORCHESTRA_DIR: ${{ github.workspace }}
        run: python -m pytest -q -rs packages/meta-harness/tests

  meta-harness-docker-containment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run Docker containment tests
        env:
          AI_ORCHESTRA_DIR: ${{ github.workspace }}
          META_HARNESS_REQUIRE_DOCKER: "1"
        run: >-
          python -m pytest -q -rs
          packages/meta-harness/tests/test_scenario_docker_integration.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install 'ruff>=0.15,<0.16'

      - name: Run ruff check
        run: ruff check .

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install 'ruff>=0.15,<0.16'

      - name: Check formatting
        run: ruff format --check .

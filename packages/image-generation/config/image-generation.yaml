# image-generation パッケージ設定
#
# image-generator エージェントが参照する画像生成専用モデル。
# Codex 組み込み image_gen は ChatGPT 認証で動くため OPENAI_API_KEY 不要。
# 注意: codex.model（gpt-5.3-codex 等）は image_gen 非対応のため、ここで
#       image_gen 対応モデルを指定する。差し替えはこのキーで行う。
# 上書きは .claude/config/image-generation/image-generation.local.yaml で可能。
image_model: gpt-5.5

# 画像内に描画する見出し・ラベル・注釈・キャプションの既定言語。
# 技術用語・固有名詞は英語のままでもよい。ユーザープロンプトに画像内テキストの
# 言語指定が明記されている場合は、その指定を優先する。
# 恒久的な変更は image-generation.local.yaml でこのキーを上書きする。
# 形式は言語コード（例: ja, en, en-US）。形式外の値は ja として扱われる。
output_language: ja

# --style 未指定時に適用する既定スタイル。config/styles/<name>.md の <name> を指定する。
# 未設定ならスタイルを適用しない。プロジェクト固有の既定値は local yaml に設定する。
# default_style: isometric

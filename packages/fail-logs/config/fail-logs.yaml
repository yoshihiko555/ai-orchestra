# fail-logs: AI の失敗イベント記録設定
#
# プロジェクト固有の上書きは fail-logs.local.yaml で行う（config-loading ルール参照）。

# 機能全体の有効/無効。false にすると一切記録しない。
enabled: true

# 失敗種別ごとの記録トグル
targets:
  tool_error: true # ツール実行エラー（Bash 非ゼロ終了・他ツールの明示エラー）
  test_failure: true # pytest / npm test 等の失敗
  lint_failure: true # ruff / mypy 等の失敗
  cli_failure: true # codex / agy 等の外部 CLI 失敗
  permission_denied: true # auto mode の分類器が拒否したツール呼び出し（PermissionDenied）

# エラー要約（error_excerpt）の最大文字数
max_excerpt_chars: 500

# ログ保存ディレクトリ（プロジェクトルートからの相対パス）
logs_dir: .claude/logs/fail-logs

# 活用フェーズ: SessionStart で再発失敗サマリーをコンテキストへ注入する設定
# 設計判断は ADR-20260630-027 を参照。
summary:
  enabled: true # SessionStart 注入の有効/無効
  window_days: 7 # 直近何日分を対象にするか（0 で無期限）
  max_records: 200 # 走査するログ行数の上限（末尾から）
  min_occurrences: 2 # 再発とみなす最小回数（これ未満は注入しない）
  top_signatures: 5 # 表示する再発シグネチャの上位件数
  show_examples: true # 代表コマンド + エラー抜粋を表示するか
  # 以下は PostToolUseFailure / PermissionDenied から記録した、テスト・lint 以外の行（その他部）にだけ効く。
  # 設計は docs/design/fail-logs.md §4 の 5〜8 を参照。
  top_signatures_new: 3 # その他部の上位件数（従来の再発の後ろに別の見出しで出す）
  max_scan_bytes: 2097152 # その他部が末尾を占めるときに、ログを末尾から走査する量の上限（バイト）
  # 意図した非ゼロ終了とみなすコマンド（終了コード 1 で、最後の単純コマンドの先頭 1〜2 トークンが一致したら集計しない）
  expected_nonzero_commands:
    - grep
    - rg
    - test
    - "["
    - diff
    - cmp
    - which
    - pgrep
    - git diff
    - git grep
    - git ls-files
  include_non_bash_tool_errors: false # Bash 以外のツールのエラー（Edit の文字列不一致など）も集計するか

# 教訓候補の台帳・提示（docs/design/fail-logs.md §8〜§10）。
# 候補は .claude/logs/fail-logs/lessons.jsonl（台帳）と lessons.md（人が読む一覧）に root worktree でまとめて保存する。
lessons:
  add_daily_limit: 20 # 追加元（agent / review など）ごとに 1 日に追加できる候補の数
  lock_wait_seconds: 5 # 台帳のロックを待つ秒数（取れなければ追加を諦めて理由を返す）
  present:
    enabled: true # セッション開始時に昇格候補を知らせるか（false で提示だけを止める）
    threshold: 2 # 提示する再発回数（異なるセッション・PR の数）
    max_items: 5 # 提示する候補の件数の上限
    max_chars: 1500 # 提示の文字数の上限
    promoting_stale_days: 14 # 昇格中のまま何日たったら反映の確認を促すか

# fail-logs: AI の失敗イベント記録設定
#
# プロジェクト固有の上書きは fail-logs.local.yaml で行う（config-loading ルール参照）。

# 機能全体の有効/無効。false にすると一切記録しない。
enabled: true

# 失敗種別ごとの記録トグル
targets:
  tool_error: true # ツール実行エラー（Bash 非ゼロ終了・他ツールの明示エラー）
  test_failure: true # pytest / npm test 等の失敗
  lint_failure: true # ruff / mypy 等の失敗
  cli_failure: true # codex / agy 等の外部 CLI 失敗
  permission_denied: true # auto mode の分類器が拒否したツール呼び出し（PermissionDenied）

# エラー要約（error_excerpt）の最大文字数
max_excerpt_chars: 500

# ログ保存ディレクトリ（プロジェクトルートからの相対パス）
logs_dir: .claude/logs/fail-logs

# 活用フェーズ: SessionStart で再発失敗サマリーをコンテキストへ注入する設定
# 設計判断は ADR-20260630-027 を参照。
summary:
  enabled: true # SessionStart 注入の有効/無効
  window_days: 7 # 直近何日分を対象にするか（0 で無期限）
  max_records: 200 # 走査するログ行数の上限（末尾から）
  min_occurrences: 2 # 再発とみなす最小回数（これ未満は注入しない）
  top_signatures: 5 # 表示する再発シグネチャの上位件数
  show_examples: true # 代表コマンド + エラー抜粋を表示するか
  # 以下は PostToolUseFailure / PermissionDenied から記録した、テスト・lint 以外の行（その他部）にだけ効く。
  # 設計は docs/design/fail-logs.md §4 の 5〜8 を参照。
  top_signatures_new: 3 # その他部の上位件数（従来の再発の後ろに別の見出しで出す）
  max_scan_bytes: 2097152 # その他部が末尾を占めるときに、ログを末尾から走査する量の上限（バイト）
  # 意図した非ゼロ終了とみなすコマンド（終了コード 1 で、最後の単純コマンドの先頭 1〜2 トークンが一致したら集計しない）
  expected_nonzero_commands:
    - grep
    - rg
    - test
    - "["
    - diff
    - cmp
    - which
    - pgrep
    - git diff
    - git grep
    - git ls-files
  include_non_bash_tool_errors: false # Bash 以外のツールのエラー（Edit の文字列不一致など）も集計するか

# 教訓候補の台帳・提示（docs/design/fail-logs.md §8〜§10）。
# 候補は .claude/logs/fail-logs/lessons.jsonl（台帳）と lessons.md（人が読む一覧）に root worktree でまとめて保存する。
lessons:
  add_daily_limit: 20 # 追加元（agent / review など）ごとに 1 日に追加できる候補の数
  lock_wait_seconds: 5 # 台帳のロックを待つ秒数（取れなければ追加を諦めて理由を返す）
  present:
    enabled: true # セッション開始時に昇格候補を知らせるか（false で提示だけを止める）
    threshold: 2 # 提示する再発回数（異なるセッション・PR の数）
    max_items: 5 # 提示する候補の件数の上限
    max_chars: 1500 # 提示の文字数の上限
    promoting_stale_days: 14 # 昇格中のまま何日たったら反映の確認を促すか

# 教訓化（docs/design/fail-logs.md §7）。既定で有効。セッションの終了時に、合図（人の訂正・手動の拒否・中断、
# 未解決や反復の失敗）があったセッションだけを、道具を持たない `claude -p` に渡して教訓候補を作る（費用が発生する）。
# 止めるには fail-logs.local.yaml に `distill: {enabled: false}` を書く。
distill:
  enabled: true
  model: sonnet # 教訓化セッションのモデル（英数字・`.`・`-`・`[`・`]` だけ）
  language: ja # 候補の文面の言語
  include_noninteractive: false # `claude -p` など非対話のセッションも教訓化するか
  daily_limit: 10 # 1 日に教訓化セッションを呼ぶ回数の上限
  reserve_for_intervention: 2 # 残りがこの数以下のときは、人の介入があったセッションだけを通す
  lock_wait_seconds: 600 # 同時に動く教訓化を 1 つにするロックを待つ秒数
  timeout_seconds: 300 # 1 回の教訓化セッションの時間の上限
  max_budget_usd: 0.5 # 1 回の教訓化セッションの費用の上限（`claude -p --max-budget-usd`）
  max_transcript_bytes: 8388608 # セッションの記録を末尾から読む量の上限
  max_input_chars: 60000 # 教訓化セッションに渡す抜粋の文字数の上限
  max_known_lessons: 80 # 合流の判定に渡す既存の候補の数の上限
  max_lessons_per_session: 5 # 1 回で作る候補の数の上限
  context_before: 6 # 合図の前に抜粋するメッセージの数
  context_after: 4 # 合図の後に抜粋するメッセージの数
  repeat_threshold: 2 # テスト・lint 以外の同じ失敗を何回で「反復」とみなすか
  repeat_threshold_test: 3 # テスト・lint の同じ失敗を何回で「反復」とみなすか
  reject_markers: # 手動の拒否の定型文（ツール結果の本文の先頭と照合。Claude Code 2.1.317 で確認）
    - "The user doesn't want to proceed with this tool use."
    - "The user doesn't want to take this action right now."
  interrupt_markers: # 中断の定型文（テキストの全体と照合。Claude Code 2.1.317 で確認）
    - "[Request interrupted by user]"
    - "[Request interrupted by user for tool use]"
  correction_cues: # 訂正の語彙（文字列の部分一致。英語は大文字小文字を区別しない）
    - "そうじゃない"
    - "じゃない"
    - "そうではない"
    - "ではなく"
    - "しないで"
    - "と言った"
    - "決まりだ"
    - "ダメ"
    - "だめ"
    - "そうではなく"
    - "じゃなくて"
    - "ではなくて"
    - "違います"
    - "違う"
    - "ちがう"
    - "やめて"
    - "戻して"
    - "勝手に"
    - "頼んでない"
    - "頼んでいない"
    - "指示していない"
    - "言ったのに"
    - "って言った"
    - "やり直して"
    - "間違って"
    - "おかしい"
    - "余計な"
    - "that's not what"
    - "not what i asked"
    - "that's wrong"
    - "this is wrong"
    - "you shouldn't"
    - "you should not"
    - "don't do that"
    - "i didn't ask"
    - "i did not ask"
    - "revert that"
    - "undo that"
    - "stop doing"
    - "i told you"
    - "why did you"
  env_allowlist: # 教訓化セッションに渡す環境変数（`*` は前方一致）。Bedrock / Vertex の利用者は必要な変数を足す
    - "PATH"
    - "HOME"
    - "USER"
    - "LOGNAME"
    - "LANG"
    - "LC_*"
    - "TMPDIR"
    - "TERM"
    - "HTTP_PROXY"
    - "HTTPS_PROXY"
    - "NO_PROXY"
    - "ALL_PROXY"
    - "http_proxy"
    - "https_proxy"
    - "no_proxy"
    - "all_proxy"
    - "SSL_CERT_FILE"
    - "NODE_EXTRA_CA_CERTS"
    - "CLAUDE_CONFIG_DIR"
    - "ANTHROPIC_*"
    - "CLAUDE_CODE_USE_*"

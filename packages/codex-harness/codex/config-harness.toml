# codex-harness canonical config fragment (source of truth).
#
# This file is never copied verbatim into a project. Instead
# `scripts/lib/sync_engine.py::apply_codex_harness_config()` reads it and
# merges its pieces into the project's `.codex/config.toml`:
#
#   - `default_permissions` (top-level key) and `[features].hooks`:
#     add-if-missing only (never overwrite a user-chosen value)
#   - `[permissions.*]` sections: upsert (harness-owned, always kept in sync)
#
# See docs/design/codex-cli-harness.md §5.5 for rationale.

default_permissions = "project-edit"

[features]
hooks = true

[permissions.project-edit]
extends = ":workspace"

[permissions.project-edit.filesystem.":workspace_roots"]
"." = "write"
"**/.env" = "deny"
"**/*.env" = "deny"
"**/.ssh/**" = "deny"
"**/.aws/**" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
# Guardrail self-tamper protection: an agent must not be able to disable or
# rewrite the hooks/rules/trust-ledger that constrain it (see
# docs/design/codex-cli-harness.md §0 for the trust-ledger integrity caveat).
"**/.codex/hooks/**" = "deny"
"**/.codex/hooks.json" = "deny"
"**/.codex/rules/**" = "deny"
"**/.codex/validation.json" = "deny"
"**/.codex/config.toml" = "deny"
"**/.codex/schemas/**" = "deny"
"**/.claude/orchestra.json" = "deny"

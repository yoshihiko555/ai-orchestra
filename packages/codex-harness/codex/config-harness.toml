# codex-harness canonical config fragment (source of truth).
#
# This file is never copied verbatim into a project. Instead
# `scripts/lib/sync_engine.py::apply_codex_harness_config()` reads it and
# merges its pieces into the project's `.codex/config.toml`:
#
#   - `[features].hooks`: add-if-missing only (never overwrite a user-chosen value)
#
# The harness deliberately does NOT set `default_permissions` / a
# `[permissions.*]` profile / `sandbox_mode`. Those override the user's own
# Codex sandbox configuration (e.g. a global `~/.codex/config.toml` with
# `sandbox_mode = "workspace-write"` + `approval_policy = "on-request"`), and a
# repo-local `default_permissions = "project-edit"` profile was found to block
# ordinary interactive Git/network workflows that the user's own config allowed
# (Issue #161: git add/commit in a worktree, and gh/network access, stopped
# working after the harness imposed the profile). The harness's guardrails are
# provided by hooks (secret scan / command policy / stop-time validation) and
# `.codex/rules/codex-harness.rules`, which do not depend on a permission
# profile. Sandbox/approval posture is left to the user's Codex config.
#
# See docs/design/codex-cli-harness.md §5.5 / §10 for rationale.

[features]
hooks = true

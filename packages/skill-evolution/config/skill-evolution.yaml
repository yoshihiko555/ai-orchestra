# skill-evolution v2: 実行範囲の記録
# プロジェクト固有の上書きは skill-evolution.local.yaml（config-loading ルール参照）。
enabled: true

storage:
  dir: ".claude/skill-evolution" # 非推奨の v1 設定。v2 では使わない。
  logs_dir: ".claude/logs/skill-evolution" # root worktree に集約する。

runs:
  hash_max_files: 200
  hash_max_bytes: 1048576
ledger:
  excerpt_max_chars: 300
  lock_wait_seconds: 5
draft:
  model: sonnet
  max_budget_usd: 1.0
  timeout_seconds: 300
  max_files: 4
  max_file_bytes: 16384
  max_attempts_per_candidate: 3

# 以下は非推奨の v1 設定。既存の local.yaml との互換性のため残すが、v2 では使わない。
# lessons/<skill>.md の肥大化管理（NF-01: 注入コンテキストを膨らませない）。
lessons:
  max_lines: 40 # 「学び」セクションの保持行数。超過分は archive へ退避
  inject_max_chars: 4000 # 発火前注入時の最大文字数

# pending の回収猶予（フォーク中の実行を Stop hook が早期回収しない）。
pending:
  stale_after_seconds: 600 # 10 分。Stop hook のフォールバック記録がフォーク中サブエージェントの pending を早期に奪わないためのグレース期間

# オフライン反復ループのガード（NF-02: 無限ループに陥らない）。
offline:
  max_iterations: 10 # 最大反復上限
  max_cost_usd: 5.0 # コスト打ち切り
  holdout_ratio: 0.3 # 固定シナリオの holdout 割合
  stop: # 連続 consecutive 回すべて満たしたら停止
    consecutive: 2
    accuracy_delta_pt: 3 # 精度（judge 総合スコア）変化がこの pt 以内
    steps_pct: 10 # ステップ数変化が ±this%
    time_pct: 15 # 所要時間変化が ±this%
  guards:
    divergence_rounds: 3 # この回数改善なしで発散 → 人間通知して停止
    overfit_drop_pt: 15 # holdout がこの pt 超下落で過学習停止

# オフライン起動口: lessons 蓄積がこの件数を超えたら起動候補。
trigger:
  lessons_threshold: 20

schema_version: "1.0"
id: create-version-file
target: claude-harness
description: >-
  現在の git HEAD の short SHA を VERSION ファイルに書き出す基本タスク。
  command_exit のみで判定する決定論的な baseline（rubric_judge 非依存）。
prompt: |
  `git rev-parse --short HEAD` を実行して得られる値だけを、リポジトリのルートに
  VERSION というファイル名で書き出してください。末尾の改行以外の余分な文字
  （空白・引用符・接頭辞など）を含めないでください。
setup: []
command_timeout_ms: 60000
critical:
  # gate（実行成立性 = 成果物の存在）: 内容の正誤は graded 側が担当する
  # （ADR-20260817-052、既存2本の最小転換。挙動の意味は変えない）。
  - id: version-file-exists
    text: "VERSION が生成される"
    oracle: artifact_exists
    path: "VERSION"
graded:
  # graded（出来栄え = 内容の正誤）: 転換前の critical そのまま（command は無改修）。
  - id: version-file-matches-head
    text: "VERSION の内容が git rev-parse --short HEAD の出力と一致すること"
    oracle: command_exit
    command: >-
      test "$(cat VERSION | tr -d '[:space:]')" = "$(git rev-parse --short HEAD)"
holdout: false
timeout_ms: 300000
budget:
  max_turns: 10
  max_budget_usd: 3.0
repeat: 1

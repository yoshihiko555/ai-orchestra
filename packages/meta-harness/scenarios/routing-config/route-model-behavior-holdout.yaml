schema_version: "1.0"
id: route-model-behavior-holdout
target: routing-config
description: Exercise review behavior selected from the effective architect routing.
prompt: |
  外部 CLI を起動せず、設定に応じたレビュー計画を作ってください。
  cli-tools.yaml と存在する cli-tools.local.yaml を読み、local 優先で agents.architect.tool を解決する。
  codex なら action は delegate-review、result.steps は [inspect, cross-check, review]。
  claude-direct または auto なら action は review-directly、result.steps は [read, verify, report]。
  リポジトリ直下の routing-behavior-holdout.json に、resolved_key: agents.architect.tool、
  resolved_value: 解決した tool、action、result.steps を持つ JSON を書く。既存ファイルは変更しない。
allowed_tools:
  - Read
  - Write
setup: []
command_timeout_ms: 60000
critical:
  - id: routing-behavior-holdout-exists
    text: "architect routing に応じた Claude 作業成果物が存在する"
    oracle: artifact_exists
    path: "routing-behavior-holdout.json"
  - id: routing-behavior-holdout-matches
    text: "成果物の計画が materialize 済み architect tool と一致する"
    oracle: command_exit
    command: "python3 packages/meta-harness/scenarios/fixtures/assert-routing-behavior.py --scenario holdout --artifact routing-behavior-holdout.json"
checks: []
holdout: true
timeout_ms: 180000
budget:
  max_turns: 6
  # Issue #261 PR4: Sonnet pin(#265) + 1M context 無効化(#269) 前提の再較正。
  # broker worst-case 前課金 ≈ body 50KB × $6.0/MTok + 512 tok × $15/MTok ≈ $0.31/req が
  # 6-turn の逐次コンテキスト成長込みで収まる水準（旧 $0.75 は旧 Opus 価格で初回 429）。
  max_budget_usd: 1.5
  max_output_tokens: 512
repeat: 1

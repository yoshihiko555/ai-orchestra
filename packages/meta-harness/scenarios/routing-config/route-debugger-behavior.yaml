schema_version: "1.0"
id: route-debugger-behavior
target: routing-config
description: Exercise Claude behavior selected from the effective debugger tool route.
prompt: |
  `agents.debugger.tool` の実効値に応じた作業を行ってください。外部 CLI は起動しません。

  1. `.claude/config/agent-routing/cli-tools.yaml` と、存在する場合は
     `.claude/config/agent-routing/cli-tools.local.yaml` を読み、local を優先する。
     agent-routing と同じ規則で `agents.debugger.tool` を解決する。
     - `codex` / `antigravity` は対応する `<tool>.enabled: false` の場合
       `claude-direct` にフォールバックする。
     - `auto` は有効な CLI alias から `codex`、`antigravity` の順で選び、
       どちらも無効なら `claude-direct` を選ぶ。
  2. 数列 `[3, 1, 4, 1, 5]` に対し、解決値ごとに次の作業を行う。
     - `codex`: 最初に重複する値を求める。
     - `antigravity`: 異なる値の個数を求める。
     - `claude-direct`: 昇順に並べる。
     - `auto`: debugging task に選ぶ tool を決める。
  3. リポジトリ直下の `routing-behavior-train.json` に、フォールバック適用後の
     解決値に対応する次の JSON だけを書く（既存ファイルは変更しない）。
     - `codex`: `{"resolved_key":"agents.debugger.tool","resolved_value":"codex","action":"delegate-debug-analysis","result":{"first_duplicate":1}}`
     - `antigravity`: `{"resolved_key":"agents.debugger.tool","resolved_value":"antigravity","action":"research-sequence-pattern","result":{"unique_count":4}}`
     - `claude-direct`: `{"resolved_key":"agents.debugger.tool","resolved_value":"claude-direct","action":"solve-sequence-directly","result":{"sorted":[1,1,3,4,5]}}`
     - `auto`: `{"resolved_key":"agents.debugger.tool","resolved_value":"auto","action":"select-debug-route","result":{"selected_tool":"codex"}}`
       （`codex` が無効なら `selected_tool` は次の有効 alias、全 CLI 無効なら
       `claude-direct`）
allowed_tools:
  - Read
  - Write
setup: []
command_timeout_ms: 60000
critical:
  - id: routing-behavior-train-exists
    text: "debugger route に応じた Claude 作業成果物が存在する"
    oracle: artifact_exists
    path: "routing-behavior-train.json"
  - id: routing-behavior-train-matches
    text: "成果物の作業内容が materialize 済み debugger route と一致する"
    oracle: command_exit
    command: "python3 packages/meta-harness/scenarios/fixtures/assert-routing-behavior.py --scenario train --artifact routing-behavior-train.json"
checks: []
holdout: false
timeout_ms: 180000
budget:
  max_turns: 6
  max_budget_usd: 0.75
  max_output_tokens: 512
repeat: 1

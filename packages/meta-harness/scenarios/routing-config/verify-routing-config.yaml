schema_version: "1.0"
id: verify-routing-config
target: routing-config
description: Verify routing config materialization and the agent-routing regression suite.
prompt: |
  この評価 worktree の routing config が読み込めることを確認してください。
  ファイルは変更せず、確認できたことだけを簡潔に報告してください。
allowed_tools:
  - Read
setup: []
command_timeout_ms: 120000
critical:
  - id: routing-local-config-exists
    text: "評価 worktree に cli-tools.local.yaml が materialize されている"
    oracle: artifact_exists
    path: ".claude/config/agent-routing/cli-tools.local.yaml"
  - id: routing-local-config-is-effective
    text: "load_cli_tools_config の結果に全 patch 値が反映される"
    oracle: command_exit
    command: "python3 packages/meta-harness/scenarios/fixtures/assert-routing-config-layer.py"
  - id: agent-routing-regression-suite-passes
    text: "materialize 済み local override の下で agent-routing tests が通過する"
    oracle: command_exit
    command: "python3 -m pytest -q packages/agent-routing/tests"
checks: []
holdout: false
timeout_ms: 300000
budget:
  max_turns: 3
  # Issue #261 PR4: Sonnet pin(#265) + 1M context 無効化(#269) 前提の再較正。
  # broker worst-case 前課金 ≈ body 50KB × $6.0/MTok + 512 tok × $15/MTok ≈ $0.31/req が
  # 3-turn の逐次コンテキスト成長込みで収まる水準（旧 $0.50 は旧 Opus 価格で初回 429）。
  max_budget_usd: 0.9
  max_output_tokens: 512
repeat: 1

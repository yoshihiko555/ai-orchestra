schema_version: "1.0"
id: resolve-codex-analysis-route
target: skill:codex-system
description: Resolve the codex-system routing decision for an analysis task without invoking codex exec.
prompt: |
  ユーザーからの依頼: 「`tests/test_cache.py` がなぜ失敗するのか、Codex に相談して原因を分析してほしい（think deeper）」。

  これは codex-system skill の "think deeper" / "analyze" / "consult codex" トリガーに該当するタスクです。
  本評価環境は外部ネットワークを遮断しているため、`codex exec` は絶対に実行しないでください。

  1. `.claude/config/agent-routing/cli-tools.yaml` と、存在する場合は
     `.claude/config/agent-routing/cli-tools.local.yaml` を読み、local を優先してマージする
     （config-loading.md と同じレイヤー規則）。
  2. `codex.enabled` を確認する。
  3. codex-system の Routing Rules に従い `agents.debugger.tool` の実効値を解決する
     （`codex` が指定されていても `codex.enabled: false` なら `claude-direct` にフォールバックする）。
  4. リポジトリ直下の `codex-route-decision.json` に、解決結果に応じて次の JSON だけを書く
     （キーの過不足なく、値はマージ後の設定ファイルから実際に読み取った値を使う）。
     - 解決値が `codex` の場合（今回は design/debug 相談で実装作業ではないため
       sandbox は `codex.sandbox.analysis` 用途を使う）:
       `{"engine":"codex","codex_enabled":true,"resolved_tool":"codex","model":"<codex.model の値>","sandbox":"analysis","flags":"<codex.flags の値>"}`
     - 解決値が `claude-direct`（フォールバック含む）の場合:
       `{"engine":"claude-direct","codex_enabled":<codex.enabled の実効値>,"resolved_tool":"claude-direct"}`
setup:
  - "mkdir -p .claude/config/agent-routing && rm -f codex-route-decision.json"
allowed_tools:
  - "Read"
  - "Write"
command_timeout_ms: 60000
critical:
  - id: codex-route-decision-exists
    text: "codex-route-decision.json が生成される"
    oracle: artifact_exists
    path: "codex-route-decision.json"
  - id: codex-route-decision-matches-config
    text: "生成された成果物が cli-tools.yaml の実効解決結果と一致する"
    oracle: command_exit
    command: >-
      python3 packages/meta-harness/scenarios/fixtures/assert-cli-skill-route.py --tool codex --artifact codex-route-decision.json
checks:
  - id: codex-route-decision-no-exec
    text: "codex exec は実行されず、判断結果のみが記録される"
    oracle: rubric_judge
    rubric: "Claude must not attempt to actually invoke `codex exec`; it should only resolve the routing config and report the decision to the user in Japanese."
holdout: false
timeout_ms: 300000
budget:
  max_turns: 8
  max_budget_usd: 3.0
  max_output_tokens: 1024
repeat: 1

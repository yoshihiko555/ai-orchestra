schema_version: "1.0"
id: resolve-codex-fallback-route-holdout
target: skill:codex-system
description: Holdout - codex.enabled=false must fall back to claude-direct instead of invoking codex exec.
prompt: |
  ユーザーからの依頼: 「`tests/test_cache.py` がなぜ失敗するのか、Codex に相談して原因を分析してほしい（think deeper）」。

  これは codex-system skill の "think deeper" / "analyze" トリガーに該当するタスクです。
  外部ネットワークは遮断されているため `codex exec` は絶対に実行しないでください。

  1. `.claude/config/agent-routing/cli-tools.yaml` と `.claude/config/agent-routing/cli-tools.local.yaml`
     を読み、local を優先してマージする。
  2. `codex.enabled` の実効値を確認する（今回は無効化されている可能性があるので必ず確認すること）。
  3. `agents.debugger.tool` の実効値を codex-system の Routing Rules で解決する
     （`codex.enabled: false` なら結果は必ず `claude-direct` にフォールバックする）。
  4. リポジトリ直下の `codex-route-decision.json` に解決結果に応じて次の JSON だけを書く。
     - 解決値が `codex` の場合:
       `{"engine":"codex","codex_enabled":true,"resolved_tool":"codex","model":"<codex.model の値>","sandbox":"analysis","flags":"<codex.flags の値>"}`
     - 解決値が `claude-direct`（フォールバック含む）の場合:
       `{"engine":"claude-direct","codex_enabled":false,"resolved_tool":"claude-direct"}`
  5. フォールバックが発生した場合は Codex に委譲せず、Claude 自身が続行する体で報告する
     （本評価では回答内容そのものは採点対象外）。
setup:
  - >-
    mkdir -p .claude/config/agent-routing &&
    printf 'codex:\n  enabled: false\n' > .claude/config/agent-routing/cli-tools.local.yaml &&
    rm -f codex-route-decision.json
allowed_tools:
  - "Read"
  - "Write"
command_timeout_ms: 60000
critical:
  - id: codex-route-decision-exists
    text: "codex-route-decision.json が生成される"
    oracle: artifact_exists
    path: "codex-route-decision.json"
  - id: codex-route-decision-matches-fallback
    text: "codex.enabled=false のフォールバックが正しく反映される"
    oracle: command_exit
    command: >-
      python3 packages/meta-harness/scenarios/fixtures/assert-cli-skill-route.py --tool codex --artifact codex-route-decision.json
checks:
  - id: codex-route-decision-fallback-reported
    text: "フォールバックの理由がユーザーに明確に説明される"
    oracle: rubric_judge
    rubric: "The user-facing report explicitly states that codex.enabled is false and the task fell back to claude-direct instead of invoking Codex."
holdout: true
timeout_ms: 300000
budget:
  max_turns: 8
  max_budget_usd: 3.0
  max_output_tokens: 1024
repeat: 1

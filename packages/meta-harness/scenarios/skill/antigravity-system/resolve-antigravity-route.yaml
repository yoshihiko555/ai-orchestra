schema_version: "1.0"
id: resolve-antigravity-route
target: skill:antigravity-system
description: Resolve the antigravity-system routing decision for a research task without invoking agy.
prompt: |
  ユーザーからの依頼: 「最新の FastAPI の非同期テストベストプラクティスについて調べてほしい（research）」。

  これは antigravity-system skill の "research" / "investigate" トリガーに該当するタスクです。
  本評価環境は外部ネットワークを遮断しているため、`agy` は絶対に実行しないでください。

  1. `.claude/config/agent-routing/cli-tools.yaml` と、存在する場合は
     `.claude/config/agent-routing/cli-tools.local.yaml` を読み、local を優先してマージする。
  2. `antigravity.enabled` を確認する。
  3. antigravity-system の Tool Selection に従い `agents.researcher.tool` の実効値を解決する
     （`antigravity` が指定されていても `antigravity.enabled: false` なら `claude-direct` に
     フォールバックする）。
  4. `antigravity.model` が `antigravity.model_allowlist` に含まれるか確認する
     （antigravity-delegation.md の「model allowlist チェック」）。
  5. リポジトリ直下の `antigravity-route-decision.json` に、解決結果に応じて次の JSON だけを書く
     （キーの過不足なく、値はマージ後の設定ファイルから実際に読み取った値を使う）。
     - 解決値が `antigravity` の場合:
       `{"engine":"antigravity","antigravity_enabled":true,"resolved_tool":"antigravity","model":"<antigravity.model の値>","allowlist_warning":<model が allowlist に含まれなければ true、含まれれば false>}`
     - 解決値が `claude-direct`（フォールバック含む）の場合:
       `{"engine":"claude-direct","antigravity_enabled":<antigravity.enabled の実効値>,"resolved_tool":"claude-direct"}`
setup:
  - "mkdir -p .claude/config/agent-routing && rm -f antigravity-route-decision.json"
allowed_tools:
  - "Read"
  - "Write"
command_timeout_ms: 60000
critical:
  - id: antigravity-route-decision-exists
    text: "antigravity-route-decision.json が生成される"
    oracle: artifact_exists
    path: "antigravity-route-decision.json"
  - id: antigravity-route-decision-matches-config
    text: "生成された成果物が cli-tools.yaml の実効解決結果と一致する"
    oracle: command_exit
    command: >-
      python3 packages/meta-harness/scenarios/fixtures/assert-cli-skill-route.py --tool antigravity --artifact antigravity-route-decision.json
checks:
  - id: antigravity-route-decision-no-exec
    text: "agy は実行されず、判断結果のみが記録される"
    oracle: rubric_judge
    rubric: "Claude must not attempt to actually invoke `agy`; it should only resolve the routing config and report the decision to the user in Japanese."
holdout: false
timeout_ms: 300000
budget:
  max_turns: 8
  max_budget_usd: 3.0
  max_output_tokens: 1024
repeat: 1

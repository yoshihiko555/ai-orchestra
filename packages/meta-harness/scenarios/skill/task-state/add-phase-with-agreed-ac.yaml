schema_version: "1.0"
id: add-phase-with-agreed-ac
target: skill:task-state
description: Add a new phase carrying a pre-agreed (via /preflight) Acceptance Criteria section without touching any existing content.
prompt: |
  /task-state add-phase "Phase 3: リリース準備" --tasks "デプロイ手順書作成" "リリースノート作成"

  This request comes from `/preflight`, which already reached agreement with the user on this
  new phase's Acceptance Criteria. Add exactly these two conditions to the new phase's
  `#### Acceptance Criteria` section, both left unchecked:

  - 主要エンドポイントが 200ms 以内に応答する — verify: `pytest tests/perf/test_latency.py`
  - リリースノートの記載内容が十分にユーザーへ伝わる — judge: 変更点・影響範囲・移行手順が明記されている

  This is an offline evaluation harness with no interactive follow-up; do not ask any further
  questions. Insert the new phase into `.claude/Plans.md` right before the existing project
  separator (`---`), and do not modify Phase 2, the CODD frontmatter, or the Decisions/Notes
  sections.
setup:
  - |
    mkdir -p .claude
    cat > .claude/Plans.md <<'PLANSEOF'
    ---
    codd:
      node_id: "plan:meta-harness-eval-fixture"
      kind: plan
      status: active
      depends_on:
        - id: "design:meta-harness"
          relation: implements
    ---

    # Plans

    ## Project: meta-harness-eval-fixture

    ### Phase 2: 実装 `cc:WIP`

    #### API

    - `cc:done` ユーザー認証API
    - `cc:WIP` 商品一覧API
    - `cc:TODO` 注文API

    ---

    ## Decisions

    - 2026-01-01: 初期設計方針を確定

    ## Notes

    - 評価用フィクスチャ
    PLANSEOF
allowed_tools:
  - "Read"
  - "Edit"
  - "Write"
# Issue #297 / PR #326 review round 1: mark-task-done / record-architecture-decision-holdout と
# 同型（同一 .claude/Plans.md 対象）。`.claude/` は protected path のため allow ルール
# （`Edit(path)` / `Write(path)`）では書込みを事前承認できない（公式 docs:
# code.claude.com/docs/en/permission-modes.md "Protected paths"）。非対話で解除する唯一の手段が
# --permission-mode bypassPermissions のため、このシナリオに限定して明示 opt-in する。
# 防衛線: コンテナ隔離（ADR-20260712-035）+ --tools による tool 集合最小化（Read/Edit/Write のみ、
# Bash 等は非公開）+ oracle の Plans.md 全文一致 assert（挿入されたフェーズブロック以外の
# collateral damage を含む differ を fail 化）+ collateral-scope oracle（bypass で書込み可能に
# なった .claude/ 配下の Plans.md 以外の tracked file が一切変更されていないことを git diff で
# 検証）+ Phase A の human merge review。
permission_mode: bypassPermissions
command_timeout_ms: 60000
critical:
  - id: phase-with-ac-inserted-without-collateral-damage
    text: "Plans.md 全体を canonical fixture と突合し、新規 Phase 3 見出し・Acceptance Criteria セクション（verify/judge 各 1 件・未チェック）・2 タスクの挿入以外の差分が一切ないことを検証する（既存 Phase 2・Decisions・Notes・frontmatter・区切り線を包含）"
    oracle: command_exit
    command: >-
      python3 packages/meta-harness/scenarios/fixtures/assert-task-state-outcome.py add-phase-with-ac --plans .claude/Plans.md --phase-name "Phase 3: リリース準備" --verify-text "主要エンドポイントが 200ms 以内に応答する" --verify-command "pytest tests/perf/test_latency.py" --judge-text "リリースノートの記載内容が十分にユーザーへ伝わる" --judge-criteria "変更点・影響範囲・移行手順が明記されている" --tasks "デプロイ手順書作成" "リリースノート作成"
  - id: no-collateral-damage-outside-plans-md
    text: "bypassPermissions で書込み可能になった .claude/ 配下で、tracked file の変更・新規 untracked file の生成がいずれも .claude/Plans.md 以外に一切ないこと、および symlink が一切生成されていないことを検証する"
    oracle: command_exit
    # 注: `--allow .claude/Plans.md` は .claude/Plans.md 自体が repo .gitignore 対象のため、
    # tracked diff 検査に対しては実質 no-op（gitignore 済みパスは git status/diff に一切現れない）。
    # Plans.md の内容保証は上の phase-with-ac-inserted-without-collateral-damage（全文一致 oracle）
    # が担う。ここでの --allow は「万一将来 gitignore が外れた場合の安全弁」として残す。
    command: >-
      python3 packages/meta-harness/scenarios/fixtures/assert-task-state-outcome.py collateral-scope --allow .claude/Plans.md
checks:
  - id: add-phase-summary-quality
    text: "追加内容がユーザー報告で正確に説明される"
    oracle: rubric_judge
    rubric: "The final Japanese report must state that a new phase was added with an Acceptance Criteria section (one verify item and one judge item) and two TODO tasks, and it must not claim to have modified Phase 2, the CODD frontmatter, or the Decisions/Notes sections."
holdout: false
timeout_ms: 300000
budget:
  max_turns: 8
  max_budget_usd: 3.0
  max_output_tokens: 1024
repeat: 1

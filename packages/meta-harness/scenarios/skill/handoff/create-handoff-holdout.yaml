schema_version: "1.0"
id: create-handoff-holdout
target: skill:handoff
description: Holdout handoff for a partially completed database migration task.
prompt: |
  /handoff --message "Resume migration safety work: dry-run is complete, rollback test remains. Validate with python3 -m pytest -q tests/test_migrations.py. Never deploy or push."

  Generate the handoff now. Do not ask for more context.
setup:
  - "mkdir -p .meta-harness .claude/handoffs"
  - >-
    printf '# Plans\n\n- `cc:WIP` Migration safety work\n- `cc:TODO` Validate rollback behavior\n'
    > .claude/Plans.md
  # PR #273 最終レビュー: create-handoff（train）と同じ理由で素の `touch`（実行時刻）に変更する
  # （2000年固定だと pre-existing tracked file を「候補が作った」と誤判定する死角があった。
  # 根拠は create-handoff.yaml のコメント参照）。
  - "touch .meta-harness/handoff-start"
allowed_tools:
  - "Bash(python3 *)"
  # PR #273 bot レビュー3巡目対応（CodeRabbit Major）: train（create-handoff.yaml）と
  # allowed_tools を完全ミラーする。bypassPermissions 下では --allowedTools は実質 advisory
  # だが（tool 権限チェック自体が bypass される）、将来この scenario だけ bypass を外す変更が
  # 入った場合に drift したまま気付かれないことを防ぐため、値としては常に train と同期させる。
  - "Bash(python3 .claude/skills/handoff/scripts/handoff.py*)"
  - "Bash(python .claude/skills/handoff/scripts/handoff.py*)"
  - "Write"
# Issue #261 PR6 bot レビュー追撃対応: create-handoff（train）と同型（同一 skill:handoff、同じ
# `.claude/handoffs/` 成果物）のため、同じ理由で bypassPermissions が必要（`.claude/` protected
# path は allow ルールでは解除不能。Bash 経由の書込みも拒否対象であることを別 run の events で
# 裏取り確認済み、根拠は create-handoff.yaml のコメント参照）。同じ collateral-scope oracle を併設する。
permission_mode: bypassPermissions
command_timeout_ms: 60000
critical:
  - id: handoff-file-created
    text: ".claude/handoffs/ 配下に新しい（symlink でも pre-existing tracked file でもない）handoff ファイルが生成される"
    # PR #273 最終レビュー（security High）で symlink 経由の oracle 迂回が指摘されたが、POSIX
    # find の `-type f` は既定で lstat ベース（symlink 自体は追跡せず type `l` として扱われる）
    # のため、この find 単体は元々 symlink を `f` と誤認しない（macOS/GNU 双方の find で実機確認
    # 済み）。実際の迂回経路は下の handoff-is-restartable（Path.glob + stat/read_text が symlink
    # を追跡する）側だったため、そちらを修正した。
    # PR #273 6巡目 bot レビュー: create-handoff（train）と同じ理由で `git ls-tree` baseline 差引き
    # を追加する（`.claude/handoffs/` の pre-existing tracked file を touch だけで偽装できた実害を
    # 実機確認・修正済み。根拠・POSIX sh 互換にする理由は create-handoff.yaml のコメント参照）。
    # Issue #261 PR7: `-newer .meta-harness/handoff-start` の mtime 比較は撤去した（理由は
    # create-handoff.yaml のコメント参照 — `_export_container_workspace` が mtime を復元しないため
    # 決定論的に fail していた実害を bootstrap 最終検証で確認）。新規性は baseline commit 非収載
    # だけで判定する。
    oracle: command_exit
    command: >-
      git ls-tree -r --name-only HEAD -- .claude/handoffs/ > /tmp/handoff-baseline-tracked.txt && find .claude/handoffs -type f | grep -vxFf /tmp/handoff-baseline-tracked.txt | grep -q .
  - id: handoff-is-restartable
    text: "現在状態・残作業・検証手順を含み、引き継ぎ先が単独で再開できる（symlink・pre-existing tracked file は候補から除外する。新規候補ファイルは全件評価し、いずれか1件が要件を満たせば pass）"
    # PR #275 bot レビュー対応: create-handoff（train）と同じ理由で encoding="utf-8" 明示 +
    # 候補全件評価（any()）化を行う（根拠は create-handoff.yaml のコメント参照）。
    oracle: command_exit
    command: >-
      python3 -c "import subprocess; from pathlib import Path; baseline=set(subprocess.run(['git','ls-tree','-r','--name-only','HEAD','--','.claude/handoffs/'],capture_output=True,text=True,check=True).stdout.splitlines()); ps=[p for p in Path('.claude/handoffs').glob('*.md') if not p.is_symlink() and str(p) not in baseline]; assert ps, 'no non-symlink, non-preexisting handoff file was created'; contents=[p.read_text(encoding='utf-8') for p in ps]; assert any('rollback' in s.lower() and 'test_migrations.py' in s and ('push' in s.lower() or 'deploy' in s.lower()) for s in contents), 'no candidate handoff file satisfied the required keywords'"
  - id: no-collateral-damage-outside-handoffs
    text: "bypassPermissions で書込み可能になった .claude/ 配下で、tracked file の変更が .claude/Plans.md 以外に無く、新規 untracked file も .claude/handoffs/ 配下以外に生成されていないことを検証する"
    oracle: command_exit
    command: >-
      python3 packages/meta-harness/scenarios/fixtures/assert-task-state-outcome.py collateral-scope --allow .claude/Plans.md --allow-new-prefix .claude/handoffs/
  - id: plans-md-input-unchanged
    text: "handoff.py の入力である .claude/Plans.md が seed 内容から改変されていないことを検証する（.claude/Plans.md は repo .gitignore 対象のため collateral-scope の diff/untracked 検査の死角になる。PR #273 bot レビュー4巡目対応）"
    oracle: command_exit
    command: >-
      python3 -c 'expected = "# Plans\n\n- `cc:WIP` Migration safety work\n- `cc:TODO` Validate rollback behavior\n"; actual = open(".claude/Plans.md", encoding="utf-8").read(); assert actual == expected, f"Plans.md changed from seed: {actual!r}"'
checks:
  - id: handoff-content-quality
    text: "未完了の rollback 検証と禁止事項を曖昧にしない"
    oracle: rubric_judge
    rubric: "The newest handoff must distinguish completed dry-run work from pending rollback validation and preserve the no-deploy/no-push constraint."
holdout: true
timeout_ms: 300000
budget:
  # Issue #261 PR6 bot レビュー追撃対応: train（create-handoff）と同型構成のため同水準へ較正。
  max_turns: 16
  max_budget_usd: 3.0
  max_output_tokens: 1024
repeat: 1

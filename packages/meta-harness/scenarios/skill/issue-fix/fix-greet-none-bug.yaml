schema_version: "1.0"
id: fix-greet-none-bug
target: skill:issue-fix
description: Fix a reported bug via a single direct Edit and record the git/gh decisions instead of performing them (git writes are unavailable in this harness).
prompt: |
  /issue-fix 301

  This is an offline, network-free evaluation harness for the issue-fix skill:
  - `gh` is a deterministic local stub: only `gh issue view 301 --json ...` is supported and
    returns a fixed bug issue payload. Do not attempt any other `gh` subcommand.
  - Git write operations (branch creation, commit, push) are structurally unavailable in this
    harness (the worktree's git metadata is exposed as a read-only snapshot). Do NOT run
    `git checkout -b`, `git commit`, or `git push` -- they will fail. Instead, determine the
    branch name, commit message, and PR label you would use per the skill's own policy tables,
    and record that decision as JSON instead of performing the git/gh side effects.
  - No subagent Task tool is available in this harness, so handle the (single-file) code fix
    directly with Edit rather than delegating.
  - There are no reviewer subagents available, so skip the Phase 4 sub-agent review step
    entirely and note that omission in your final Japanese report.
  - The Phase 1 plan has already been reviewed and approved by the user; proceed straight to
    implementation without asking a follow-up question.

  Concretely:
  1. Read the issue via `gh issue view 301 --json number,title,body,labels,assignees`.
  2. Fix the reported bug in `sandbox/greeter.py` with a direct Edit (add a None-name guard
     that returns "Hello, Guest"; keep the existing non-None behavior unchanged).
  3. Determine the branch name and commit message you would use for this fix, following the
     skill's label -> prefix mapping table and the "Closes #<number>" convention, and the PR
     label the issue's `bug` label maps to.
  4. Write those decisions to `.meta-harness/issue-fix-decision.json` as a single JSON object
     with exactly the keys `branch`, `commit_message`, and `pr_label` (no other keys), then
     report a short Japanese summary of what you did (including the Phase 4 review omission
     note).
setup:
  - |
    mkdir -p sandbox bin .meta-harness
    cat > sandbox/greeter.py <<'PYEOF'
    def greet(name):
        return "Hello " + name
    PYEOF
    cat > .meta-harness/gh-issue-fixture.json <<'JSONEOF'
    {
      "number": 301,
      "title": "greet() crashes when name is None",
      "body": "## バグの概要\n\ngreet(None) を呼び出すと例外が送出される。\n\n## 再現手順\n\n1. sandbox/greeter.py の greet(None) を呼ぶ\n\n## 期待される動作\n\n\"Hello, Guest\" を返す\n\n## 実際の動作\n\nTypeError: can only concatenate str が送出される\n\n## 環境\n\nLinux, Python 3.12",
      "labels": [{"name": "bug"}],
      "assignees": []
    }
    JSONEOF
    cp packages/meta-harness/scenarios/fixtures/fake-gh-issue-view.py bin/gh
    chmod +x bin/gh
    rm -f .meta-harness/issue-fix-decision.json
allowed_tools:
  - "Bash(gh *)"
  - "Bash(git branch *)"
  - "Bash(git status *)"
  - "Bash(git log *)"
  - "Read"
  - "Edit"
  - "Write"
path_prepend:
  - bin
command_timeout_ms: 60000
critical:
  - id: greeter-none-guard-fixed
    text: "greet(None) が例外を出さず 'Hello, Guest' を返すよう修正される"
    oracle: command_exit
    command: >-
      python3 -B -c "import sys; sys.path.insert(0, 'sandbox'); from greeter import greet; assert greet(None) == 'Hello, Guest', greet(None); assert greet('Aoi') == 'Hello Aoi', greet('Aoi')"
  - id: issue-fix-decision-exists
    text: "issue-fix-decision.json が生成される"
    oracle: artifact_exists
    path: ".meta-harness/issue-fix-decision.json"
  - id: issue-fix-decision-matches-label-policy
    text: "記録された branch/commit_message/pr_label が bug ラベルのマッピング表と一致する"
    oracle: command_exit
    command: >-
      python3 packages/meta-harness/scenarios/fixtures/assert-issue-fix-decision.py --fixture .meta-harness/gh-issue-fixture.json --artifact .meta-harness/issue-fix-decision.json
checks:
  - id: review-omission-reported
    text: "Phase4レビューが省略された旨がユーザー報告に明記される"
    oracle: rubric_judge
    rubric: "The final Japanese report must explicitly state that the Phase 4 sub-agent review step was skipped because no reviewer subagents were available in this harness, and it must not fabricate a review outcome or claim to have actually run git/gh side effects."
holdout: false
timeout_ms: 300000
budget:
  max_turns: 10
  max_budget_usd: 3.0
  max_output_tokens: 1024
repeat: 1

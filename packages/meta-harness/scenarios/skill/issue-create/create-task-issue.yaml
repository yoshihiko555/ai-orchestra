schema_version: "1.0"
id: create-task-issue
target: skill:issue-create
description: Create a task issue through a deterministic offline gh fixture.
prompt: |
  /issue-create task オフラインキャッシュのCI検証を追加

  The task must require `python3 -m pytest -q tests/test_cache.py` as a completion condition.
  The user has reviewed and approved creation, so complete the workflow now.
setup:
  - "mkdir -p bin .meta-harness && cp packages/meta-harness/scenarios/fixtures/fake-gh.py bin/gh && chmod +x bin/gh && rm -f .meta-harness/issue-create-call.json"
allowed_tools:
  - "Bash(gh *)"
  # Issue #261 PR6 bot レビュー対応: 実測（run-20260719-154357 events）で `bin/gh` の直接実行が
  # exit 126 Permission denied となり、モデルは `python3 /workspace/bin/gh ...` へフォールバック
  # したが "Bash(gh *)" に不一致で 2 回連続 approval 待ちとなった。実測コマンド文字列に一致する
  # narrow ルールを追加する（`Bash(gh *)` は変更なしで維持）。
  - "Bash(python3 /workspace/bin/gh *)"
  - "Bash(python3 bin/gh *)"
  - "Write"
path_prepend:
  - bin
command_timeout_ms: 60000
critical:
  - id: task-template-body
    text: "task テンプレート構成で本文が作られる"
    oracle: command_exit
    command: >-
      python3 -c "import json; d=json.load(open('.meta-harness/issue-create-call.json')); assert '## タスク内容' in d['body'] and '## 完了条件' in d['body'] and 'tests/test_cache.py' in d['body']"
  - id: task-label
    text: "task ラベルが選定される"
    oracle: command_exit
    command: >-
      python3 -c "import json; d=json.load(open('.meta-harness/issue-create-call.json')); assert d['label'] == 'task'"
checks:
  - id: issue-body-quality
    text: "本文が実行可能な完了条件を含む"
    oracle: rubric_judge
    rubric: "The recorded issue body must be concise, use the task template, and contain an objectively verifiable pytest completion condition."
holdout: false
timeout_ms: 300000
budget:
  # Issue #261 PR6: 実 backend 再検証で error_max_turns（turns=9, 実費 $0.34）が発生。
  # gh フィクスチャの直接実行が exit 126 で失敗し、python3 経由の呼び出しが
  # allowed_tools の "Bash(gh *)" パターンに一致せず approval 待ちで turn を浪費した
  # （センシティブファイル拒否ではない）。8 -> 16 に引き上げる。
  max_turns: 16
  # Issue #261 PR7 追補: この train は $3.0 で pass 実績あり（据え置き）。holdout の
  # create-bug-issue-holdout は bug テンプレートの再現手順・環境記述分だけ turn が伸び、11+ turns
  # の実測が出たため 6.0 に引き上げた（create-bug-issue-holdout.yaml のコメント参照）。
  # Issue #261 PR8（最終較正）: この train も最終 evaluate で 9 turns 目に $3.00 latch した実測
  # （前回 pass はターン数の揺らぎ）。$3→$6→$9 と逐次追随するのを打ち切り、issue-create/issue-fix
  # 全4シナリオ共通で $15.00 に最終設定する。根拠: 会話成長で turn 後半の worst-case 前課金が
  # $1〜1.5/req に達する実測から、issue-create の 16 turns 上限では見込み上限 $10-11 にマージンを
  # 載せた額が必要。この上限は reward hacking 抑止のための broker 安全上限（内部会計）であり、
  # 実費は全 run $0.6 未満（実支出ではない）。
  max_budget_usd: 15.0
  max_output_tokens: 1024
repeat: 1

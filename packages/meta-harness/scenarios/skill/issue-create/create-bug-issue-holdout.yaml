schema_version: "1.0"
id: create-bug-issue-holdout
target: skill:issue-create
description: Holdout bug issue through a deterministic offline gh fixture.
prompt: |
  /issue-create bug 設定読込失敗で起動できない

  This is an offline, network-free evaluation harness for the issue-create skill:
  - The user has already reviewed the proposed bug issue and explicitly approves creation now.
  - AskUserQuestion is unavailable, and the user will provide no further input. Do not ask for
    confirmation or end the run waiting for an answer; proceed directly to issue creation.
  - Repository metadata is unavailable. Do not perform remote or repository lookups.

  Use these reviewed bug details:
  - Environment: Linux, running `example-app --config /etc/example-app/config.yaml`.
  - Reproduction: remove `/etc/example-app/config.yaml`, then start the application with the
    command above.
  - Expected: the application falls back to built-in defaults and finishes startup.
  - Actual: startup aborts with FileNotFoundError before the application becomes usable.

  The user supplied and approved these acceptance criteria:
  - [ ] Missing config files use built-in defaults and startup completes — verify: `pytest -q tests/test_config_loading.py -k missing_config_uses_defaults`
  - [ ] The issue body clearly distinguishes the missing-config reproduction, expected fallback, actual startup failure, and Linux environment — judge: Each item is stated in its matching bug-template section with enough detail to reproduce the failure.

  Build the complete bug-template body in `issue-body.md`. Completion requires the actual issue
  creation call; preparing the body alone is not complete. Run exactly
  `python3 bin/gh issue create --title "設定読込失敗で起動できない" --label bug --body-file issue-body.md`
  and then report the result without asking another question.
setup:
  - "mkdir -p bin .meta-harness && cp packages/meta-harness/scenarios/fixtures/fake-gh.py bin/gh && chmod +x bin/gh && rm -f .meta-harness/issue-create-call.json"
allowed_tools:
  - "Bash(gh *)"
  # Issue #261 PR6 bot レビュー追撃対応: create-task-issue（train）と同型の fake-gh -> bin/gh
  # 構成のため、同じ narrow ルールを追加する（根拠は create-task-issue.yaml のコメント参照）。
  - "Bash(python3 /workspace/bin/gh *)"
  - "Bash(python3 bin/gh *)"
  - "Write"
path_prepend:
  - bin
command_timeout_ms: 60000
critical:
  - id: bug-template-body
    text: "bug テンプレート構成で本文が作られる"
    oracle: command_exit
    command: >-
      python3 -c "import json; d=json.load(open('.meta-harness/issue-create-call.json')); b=d['body']; assert all(x in b for x in ['## バグの概要','## 再現手順','## 期待される動作','## 実際の動作','## 環境'])"
  - id: bug-label
    text: "bug ラベルが選定される"
    oracle: command_exit
    command: >-
      python3 -c "import json; d=json.load(open('.meta-harness/issue-create-call.json')); assert d['label'] == 'bug'"
  # PR #366 bot レビュー対応: train（create-task-issue）が AC 相当を critical で検証しているのに
  # holdout が未検証だと、AC 必須ゲートを壊す候補を frontier に通しうるため同型の検証を追加する。
  - id: bug-acceptance-criteria
    text: "受け入れ条件が verify/judge 付きで本文に残る"
    oracle: command_exit
    command: >-
      python3 -c "import json; d=json.load(open('.meta-harness/issue-create-call.json')); b=d['body']; assert '## 受け入れ条件（修正完了とみなす条件）' in b; assert 'tests/test_config_loading.py' in b; lines=b.splitlines(); assert any('— verify:' in l for l in lines); assert any('— judge:' in l for l in lines)"
checks:
  - id: issue-body-quality
    text: "再現条件と expected/actual が区別される"
    oracle: rubric_judge
    rubric: "The recorded bug body must provide reproducible missing-config steps and clearly distinguish expected fallback behavior from actual startup failure."
holdout: true
timeout_ms: 300000
budget:
  # Issue #261 PR6 bot レビュー追撃対応: train（create-task-issue）と同型構成のため同水準へ較正。
  # PR #360 追補較正（2026-08-09 夜）: 17 turn 目で error_max_turns ×3 の実測のため
  # 24 へ引き上げる（根拠は create-task-issue.yaml のコメント参照）。
  max_turns: 24
  # Issue #261 PR7 追補: 旧 baseline holdout 評価で 11 turns 時点で $3.00 に cost latch した実測
  # （run-20260720-010041-...create-bug-issue-holdout-a1-10babcee 等、error x3）。train
  # （create-task-issue、$3.0 で pass 実績あり）と異なり、この holdout は再現手順・環境記述を含む
  # bug テンプレートの分だけ turn 数が伸びやすく実測で 11+ turns に達した。16 turns 上限までの
  # worst-case 前課金を見込み 6.0 に引き上げる。
  # Issue #261 PR8（最終較正）: 最終 evaluate でも 11 turns 目に $6.00 latch ×3 の実測。$3→$6→$9
  # の逐次追随を打ち切り $15.00 に最終設定する（根拠・reward hacking 抑止上限である旨は
  # create-task-issue.yaml のコメント参照）。
  max_budget_usd: 15.0
  # PR #359 追補較正（2026-08-09）: 既定 max_total_tokens=500000 では累積 token +
  # 終盤 request の事前見積りが残余に収まらず latch する実測（run-20260809-140902-...
  # -create-bug-issue-holdout-a1 等 ×3）のため 1,500,000 へ引き上げる
  # （根拠は create-task-issue.yaml のコメント参照）。
  max_total_tokens: 1500000
  # PR #360 追補較正（2026-08-09 夜）: 12 turn 目に応答が 1024 output token 上限を
  # 超えて error（"response exceeded the 1024 output token maximum"）×2 の実測のため
  # 4096 へ引き上げる（run-20260809-191301 等。bug テンプレ本文は長文になる）。
  max_output_tokens: 4096
repeat: 1

# Machine-readable oracle seed for docs/evaluation/docker-runtime.md.
# The Markdown evaluation set remains the SSOT; this sidecar records Phase 1
# image-lifecycle coverage that can be promoted into runnable checks.

- ev_id: EV-13
  phase: 1
  priority: must
  oracle: command_exit
  command: >-
    AI_ORCHESTRA_DIR="$PWD" python3 -m pytest -q
    packages/docker-runtime/tests/test_docker_runtime_image.py::test_recipe_hash_covers_normalized_args_platform_and_target
  covered_by:
    - packages/docker-runtime/tests/test_docker_runtime_image.py::test_recipe_hash_covers_normalized_args_platform_and_target
  notes: >-
    build-arg ordering is normalized while arg values, platform, target, and
    docker_label change the hash (differing docker_label alone must change
    the hash so a label mismatch cannot cache-hit another owner's image).


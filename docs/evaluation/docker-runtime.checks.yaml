- ev_id: EV-16
  phase: 1
  priority: must
  oracle: command_exit
  command: >-
    AI_ORCHESTRA_DIR="$PWD" python3 -m pytest -q
    packages/docker-runtime/tests/test_docker_runtime_image.py::test_prune_keeps_recent_family_generations_and_label_scope
    packages/docker-runtime/tests/test_docker_runtime_image.py::test_prune_conflict_is_best_effort_and_does_not_abort_ensure_recipe_image
  covered_by:
    - packages/docker-runtime/tests/test_docker_runtime_image.py::test_prune_keeps_recent_family_generations_and_label_scope
    - packages/docker-runtime/tests/test_docker_runtime_image.py::test_prune_conflict_is_best_effort_and_does_not_abort_ensure_recipe_image
  notes: >-
    old hash tags recorded in this manifest beyond the retained generation
    count are pruned; latest, another family, and hash tags absent from this
    manifest (e.g. another project's build sharing the repository/label) are
    preserved, not pruned. A `docker image rm` conflict (e.g. the old
    generation still in use) is best-effort: it warns and leaves the entry
    in the manifest for a later retry instead of failing the build that just
    succeeded.


- ev_id: EV-18
  phase: 1
  priority: must
  oracle: command_exit
  command: >-
    AI_ORCHESTRA_DIR="$PWD" python3 -m pytest -q
    packages/docker-runtime/tests/test_docker_runtime_image.py::test_build_uses_dedicated_builder_and_scoped_cache_gc
    packages/docker-runtime/tests/test_docker_runtime_image.py::test_build_rejects_existing_builder_with_incompatible_driver
    packages/docker-runtime/tests/test_docker_runtime_image.py::test_ensure_builder_retries_inspect_after_raced_create_failure
    packages/docker-runtime/tests/test_docker_runtime_image.py::test_ensure_builder_raises_when_raced_builder_has_incompatible_driver
  covered_by:
    - packages/docker-runtime/tests/test_docker_runtime_image.py::test_build_uses_dedicated_builder_and_scoped_cache_gc
    - packages/docker-runtime/tests/test_docker_runtime_image.py::test_build_rejects_existing_builder_with_incompatible_driver
    - packages/docker-runtime/tests/test_docker_runtime_image.py::test_ensure_builder_retries_inspect_after_raced_create_failure
    - packages/docker-runtime/tests/test_docker_runtime_image.py::test_ensure_builder_raises_when_raced_builder_has_incompatible_driver
  notes: >-
    build, age prune, size inspection, and until=0 fallback all name the
    dedicated builder; a pre-existing builder/context sharing the name but
    reporting a non-docker-container driver is rejected instead of reused.
    A raced `buildx create` failure retries the inspect/driver check instead
    of failing immediately, but still rejects an incompatible-driver builder
    the racing process created.

- ev_id: EV-19
  phase: 1
  priority: must
  oracle: command_exit
  command: >-
    AI_ORCHESTRA_DIR="$PWD" python3 -m pytest -q
    packages/docker-runtime/tests/test_docker_runtime_image.py::test_manifest_partial_corruption_skips_invalid_entry_and_reuses_valid_entry
    packages/docker-runtime/tests/test_docker_runtime_image.py::test_manifest_malformed_timestamp_skips_invalid_entry_and_reuses_valid_entry
  covered_by:
    - packages/docker-runtime/tests/test_docker_runtime_image.py::test_manifest_partial_corruption_skips_invalid_entry_and_reuses_valid_entry
    - packages/docker-runtime/tests/test_docker_runtime_image.py::test_manifest_malformed_timestamp_skips_invalid_entry_and_reuses_valid_entry
  notes: >-
    a structurally invalid record is dropped, and a record with a
    non-parseable or timezone-naive built_at/last_used_at is also dropped as
    invalid (text-sorted pruning cannot safely rank malformed timestamps);
    the valid recipe entry remains a cache hit in both cases.


# task-memory パッケージ設定
# プロジェクト固有の上書き: config/task-memory.local.yaml

# plan ファイルは .claude/plans/<slug>.md に固定（ADR-20261027-059）。

# SessionStart 時にタスク状態サマリーを出力するか
show_summary_on_start: true

# サマリーで表示するタスク合計の最大数（0 = 無制限）
max_display_tasks: 20

# 状態マーカー定義（値は重複不可）
markers:
  todo: "cc:TODO"
  wip: "cc:WIP"
  done: "cc:done"
  blocked: "cc:blocked"

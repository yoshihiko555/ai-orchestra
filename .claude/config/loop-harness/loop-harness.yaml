guards:
  max_iterations: 3
  no_progress:
    repeat: 2
  infrastructure_failure:
    max_retries: 3

lock:
  ttl_seconds:
    lp1: 3600
    lp2: 300
  heartbeat_interval_seconds: 60

lp2:
  concurrency_limit: 2
  wall_clock_timeout_seconds: 7200
  # Priority-label vocabulary for loop_scheduler.py discovery sort, highest priority
  # first (e.g. ["priority:high"]). Empty by default: discovery stays plain
  # created_at-ascending FIFO unless a project opts in (docs/design/loop-harness-cli.md
  # §3.1 mentions the concept but does not enumerate a config key for it in §5.1).
  priority_labels: []

pr_review:
  poll_interval_seconds: 120
  timeout_seconds: 3600
  checkrun_allowlist: []
  severity_markers: {}
  auto_generated_markers:
    - '<!-- This is an auto-generated comment: summarize by coderabbit.ai'
    - '<!-- This is an auto-generated comment: rate limited by coderabbit.ai'
    - '<!-- This is an auto-generated comment: review in progress by coderabbit.ai'
    - '<!-- This is an auto-generated reply by CodeRabbit'
  dedup:
    line_bucket_size: 5
    stopwords_en:
      - a
      - an
      - and
      - are
      - be
      - for
      - in
      - is
      - it
      - of
      - on
      - or
      - please
      - should
      - the
      - this
      - to
    stopwords_ja:
      - が
      - です
      - で
      - と
      - に
      - の
      - は
      - ます
      - を
    signature_footer_patterns:
      - '(?ms)^---\s*$.*\Z'
  # reviewer_allowlist is intentionally project-local. Missing or empty values
  # are rejected by the pr_review_wait phase.

retention:
  purge_after_days: 30

notifications:
  macos_enabled: true
  issue_comment_enabled: true

maker:
  # issue-loop の auto Maker 選定にのみ適用。custom loop は各 phase の maker.agent を使う。
  fallback_agent: general-purpose
  allowed_agents:
    - ai-dev
    - backend-go-dev
    - backend-python-dev
    - debugger
    - frontend-dev
    - general-purpose
    - prompt-engineer
    - rag-engineer
    - tester

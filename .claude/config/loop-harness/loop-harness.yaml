guards:
  max_iterations: 3
  no_progress:
    repeat: 2
  infrastructure_failure:
    max_retries: 3

lock:
  ttl_seconds:
    lp1: 3600
    lp2: 300
  heartbeat_interval_seconds: 60

lp2:
  concurrency_limit: 2
  wall_clock_timeout_seconds: 7200
  # Priority-label vocabulary for loop_scheduler.py discovery sort, highest priority
  # first (e.g. ["priority:high"]). Empty by default: discovery stays plain
  # created_at-ascending FIFO unless a project opts in (docs/design/loop-harness-cli.md
  # §3.1 mentions the concept but does not enumerate a config key for it in §5.1).
  priority_labels: []
  isolation:
    # Docker execution remains disabled until Phase 4 containment tests pass.
    backend: none
    execution_backend: none
    image: ai-orchestra/loop-harness-scenario:2.1.207
    image_pin: null
    auto_build_images: true # false の場合 image は @sha256:<digest> 形式必須（タグ形式は DockerImageError）
    image_cache:
      manifest_path: .claude/loop/docker-image-cache.json
      keep_generations: 3
      lock_path: .claude/loop/docker-image-build.lock
      builder_name: loop-harness-builder
      buildkit_cache_max_age: 168h
      buildkit_cache_max_size: 10g
    resources:
      pids_limit: 64
      memory: 1g
      cpus: 1.0
    checker:
      read_only_worktree: true
    broker:
      image: ai-orchestra/loop-harness-broker:0.1.0
      port_range: [8790, 8990]
      idle_timeout_sec: 300
      startup_timeout_sec: 30
      budget_usd: 3.0
      max_requests: 64
      max_total_tokens: 500000
      max_upstream_bytes: 50000000
      pricing_upper_bound_usd_per_million:
        input: 15.0
        output: 75.0
        cache_creation: 18.75
        cache_read: 1.5

pr_review:
  poll_interval_seconds: 120
  timeout_seconds: 3600
  checkrun_allowlist: []
  severity_markers: {}
  auto_generated_markers:
    - '<!-- This is an auto-generated comment: summarize by coderabbit.ai'
    - '<!-- This is an auto-generated comment: rate limited by coderabbit.ai'
    - '<!-- This is an auto-generated comment: review in progress by coderabbit.ai'
    - '<!-- This is an auto-generated reply by CodeRabbit'
  dedup:
    line_bucket_size: 5
    stopwords_en:
      - a
      - an
      - and
      - are
      - be
      - for
      - in
      - is
      - it
      - of
      - on
      - or
      - please
      - should
      - the
      - this
      - to
    stopwords_ja:
      - が
      - です
      - で
      - と
      - に
      - の
      - は
      - ます
      - を
    signature_footer_patterns:
      - '(?ms)^---\s*$.*\Z'
  # reviewer_allowlist is intentionally project-local. Missing or empty values
  # are rejected by the pr_review_wait phase.

retention:
  purge_after_days: 30

notifications:
  macos_enabled: true
  issue_comment_enabled: true

maker:
  # issue-loop の auto Maker 選定にのみ適用。custom loop は各 phase の maker.agent を使う。
  fallback_agent: general-purpose
  allowed_agents:
    - ai-dev
    - backend-go-dev
    - backend-python-dev
    - debugger
    - frontend-dev
    - general-purpose
    - prompt-engineer
    - rag-engineer
    - tester

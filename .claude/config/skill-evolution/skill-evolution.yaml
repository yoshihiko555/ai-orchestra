# skill-evolution v2: 実行範囲の記録
# プロジェクト固有の上書きは skill-evolution.local.yaml（config-loading ルール参照）。
enabled: true

storage:
  logs_dir: ".claude/logs/skill-evolution" # root worktree に集約する。

runs:
  hash_max_files: 200
  hash_max_bytes: 1048576
ledger:
  excerpt_max_chars: 300
  lock_wait_seconds: 5
draft:
  model: sonnet
  max_budget_usd: 1.0
  timeout_seconds: 300
  max_files: 4
  max_file_bytes: 16384
  max_attempts_per_candidate: 3

# CLI ツール一元設定
# エージェントは実行時にこのファイルを読み、指定された値で CLI コマンドを構築する。
# 値を変更すると、このファイルを参照する全エージェントに自動で反映される。
#
# プロジェクト固有の上書き:
#   .claude/config/agent-routing/cli-tools.local.yaml に同じキーを書くと、そちらが優先される。
#   例: codex.model だけ変えたい場合
#     codex:
#       model: o3-pro

# OpenAI Codex CLI (https://github.com/openai/codex)
# 設計判断・デバッグ・コードレビューなど深い推論が必要な場面で使用
codex:
  # false にすると全 codex エージェントが claude-direct にフォールバック
  # .local.yaml で codex.enabled: false にすれば CLI 未インストール環境でも利用可能
  enabled: true
  # codex exec --model <この値> で指定される
  model: gpt-5.6-sol
  # model patch の妥当性チェック用 allowlist（human-curated menu）
  model_allowlist:
    - gpt-5.6-sol
  sandbox:
    # 読み取り専用: 設計相談・分析・レビュー向け（ファイル変更不可）
    analysis: read-only
    # 書き込み可能: 実装・修正・リファクタリング向け（ワークスペース内のファイル変更可）
    implementation: workspace-write
  # codex exec に常に付与するフラグ
  # --full-auto: 確認プロンプトなしで自動実行
  flags: --full-auto
  # sandbox 内で実行可能（enableWeakerNetworkIsolation: true が前提）
  requires_sandbox_disable: false

# Google Antigravity CLI (https://antigravity.google) — Gemini CLI の後継
# リサーチ・ドキュメント分析・コードベース理解・マルチモーダル処理で使用
antigravity:
  # false にすると全 antigravity エージェントが claude-direct にフォールバック
  # .local.yaml で antigravity.enabled: false にすれば CLI 未インストール環境でも利用可能
  enabled: true
  # agy -p "..." --model <この値> で指定される
  # 未指定（空文字）の場合は --model フラグを省略し CLI デフォルトモデルを使用
  # 注意: agy は無効な slug でも exit 0 でデフォルトモデルに黙ってフォールバックする
  model: gemini-3.1-pro-high
  # model の妥当性チェック用 allowlist（コマンド構築時に警告判定へ使用）
  # agy 側のモデル追加時は .local.yaml で上書き拡張する
  model_allowlist:
    - gemini-3.1-pro
    - gemini-3.1-pro-high
    - gemini-3.1-pro-low
    - gemini-3.5-flash-medium
    - gemini-3.5-flash-high
    - gemini-3.5-flash-low
    - claude-4.6-sonnet-thinking
    - claude-4.6-opus-thinking
    - gpt-oss-120b-medium
  # agy コマンドに常に付与するフラグ（不要なら空文字）
  flags: ""
  # sandbox 内で実行可能（sandbox.excludedCommands に agy 追加が前提）
  requires_sandbox_disable: false

# (移行メモ) 旧 gemini: キーは廃止。.local.yaml に残る gemini: 上書きは
# 読み込み時に antigravity へ正規化される（enabled のみ反映、model/flags は
# Gemini CLI 固有値のため無視）。agents.*.tool: gemini も antigravity に読み替える。

# Claude Code サブエージェントの設定
subagent:
  # 全エージェント .md のフロントマター model に適用されるデフォルトモデル
  # sync-orchestra.py が SessionStart 時にこの値で .md を自動パッチする
  # 個別上書き: agents.<name>.model で指定（null = デフォルトに従う）
  # 選択肢: sonnet, opus, haiku
  default_model: sonnet

# 言語プロトコル
language:
  # Codex/Gemini への質問に使う言語（英語の方が精度が高い傾向）
  cli_query: english
  # ユーザーへの出力に使う言語
  user_output: japanese

# Review ループ設定
# /review スキルの自動修正ループを制御する
review:
  # 最大ループ回数（レビュー → 修正 → 再レビューのサイクル上限）
  # コスト制御のため .local.yaml で変更可能
  max_loops: 3
  # 通過基準: critical_zero = Critical が 0 件で通過
  pass_threshold: critical_zero
  # 自動修正: true = Critical 指摘をサブエージェントが自動修正
  # false にするとループせず従来どおり報告のみ
  auto_fix: true

# エージェントルーティング
# 各エージェントが使用するツールを定義する。
# tool: "codex" | "antigravity" | "claude-direct" | "auto"
#   - codex: Codex CLI を使用
#   - antigravity: Antigravity CLI（agy）を使用（旧値 "gemini" は読み替え）
#   - claude-direct: 外部CLIを呼ばず自身で処理
#   - auto: タスクに応じて codex / antigravity / claude-direct を使い分け
agents:
  # --- レビュー・設計分析系（Claude Code 直接）---
  architect:
    tool: claude-direct
  api-designer:
    tool: claude-direct
  architecture-reviewer:
    tool: claude-direct
  auth-designer:
    tool: claude-direct
  code-reviewer:
    tool: claude-direct
  data-modeler:
    tool: claude-direct
  performance-reviewer:
    tool: claude-direct
  security-reviewer:
    tool: claude-direct
  spec-reviewer:
    tool: claude-direct
  ux-reviewer:
    tool: claude-direct

  # --- 実装・開発系（Codex CLI）---
  ai-dev:
    tool: codex
    sandbox: workspace-write
  backend-go-dev:
    tool: codex
    sandbox: workspace-write
  backend-python-dev:
    tool: codex
    sandbox: workspace-write
  debugger:
    tool: codex
    sandbox: workspace-write
  frontend-dev:
    tool: codex
    sandbox: workspace-write
  rag-engineer:
    tool: codex
    sandbox: workspace-write
  spec-writer:
    tool: codex
    sandbox: workspace-write
  tester:
    tool: codex
    sandbox: workspace-write

  # --- マルチツール系（状況に応じて使い分け）---
  ai-architect:
    tool: auto
    model: null
  general-purpose:
    tool: auto
    model: null

  # --- リサーチ系（Antigravity CLI）---
  researcher:
    tool: antigravity
    model: null

  # --- その他（Claude Code 直接）---
  docs-writer:
    tool: claude-direct
  planner:
    tool: claude-direct
  prompt-engineer:
    tool: claude-direct
  requirements:
    tool: claude-direct
  specialized-mcp-builder:
    tool: claude-direct
  support-executive-summary-generator:
    tool: claude-direct
  testing-reality-checker:
    tool: claude-direct

storage:
  root: null # null = git-common-dir からメインルートを自動解決。絶対パスで明示上書き可（§2-0）
  dir: .claude/meta-harness # storage.root（メインルート）相対
evaluate:
  worktree_root: .worktrees/meta # メインルート相対（§2-0）
  repeat_default: 1
  repeat_frontier: 3
  # Container lifetime adds broker idle + 60s; larger per-check timeouts end at that cap first.
  timeout_ms_default: 300000
  permission_mode: acceptEdits
  allowed_tools:
    - "Read"
    - "Glob"
    - "Grep"
    - "Edit"
    - "Write"
    - "Bash(git *)"
    - "Bash(python *)"
    - "Bash(python3 *)"
    - "Bash(pytest *)"
  model: claude-sonnet-5 # Issue #261 PR2: Opus 既定による過小予算計上の安全回帰を防ぐため pin（judge.model と同値）
  cli_version_pin: null # null = バージョン一致検証をスキップ（capability smoke test は常に実施）
  isolation:
    backend: docker # Docker + dual-homed ephemeral broker（ADR-20260712-035）
    execution_backend: docker # 非隔離 backend へは降格しない
    # The tag after `:` is display-only; the actual built/reused image is
    # selected by the content-addressed `sha-<hash12>` tag docker-runtime
    # computes from the recipe (context + build args + image_pin etc.), not
    # by this string. `image_pin` is the source of truth for the intended
    # Claude Code version. Changing only this tag does not trigger a rebuild.
    image: ai-orchestra/meta-harness-scenario:2.1.207
    image_pin: "2.1.207 (Claude Code)"
    auto_build_images: true
    # Persistent, content-addressed image cache (packages/docker-runtime's
    # `ensure_recipe_image`). All paths below are resolved relative to the
    # storage.root main root; see storage.root above.
    image_cache:
      # Path to the JSON manifest recording digest -> {image_id, built_at,
      # last_used_at}. Default when unset: .claude/meta-harness/docker-image-cache.json
      manifest_path: .claude/meta-harness/docker-image-cache.json
      # Number of most-recently-used image generations to keep per family
      # (scenario/broker) before pruning older ones. Default when unset: 3
      keep_generations: 3
      # Path to the flock file serializing manifest reads/writes and,
      # per-family, concurrent builds. Default when unset:
      # .claude/meta-harness/docker-image-build.lock
      lock_path: .claude/meta-harness/docker-image-build.lock
      # Dedicated `docker buildx` builder name used for all builds/GC in
      # this namespace (never the developer's default builder). Default
      # when unset: meta-harness-builder
      # WARNING: `docker buildx prune --builder <builder_name>` GCs every
      # build cache attached to that builder, not just this namespace's. If
      # `builder_name` is shared across multiple projects/namespaces (e.g.
      # via a `.local.yaml` override reusing another project's builder),
      # the age/size-based prune below will also evict that other
      # project's build cache. Keep `builder_name` unique per project
      # unless cache sharing is explicitly intended (Issue #307).
      builder_name: meta-harness-builder
      # BuildKit cache prune threshold, as a Go duration string (e.g. "24h",
      # "168h"). Caches older than this are pruned after every build.
      # Default when unset: 168h
      buildkit_cache_max_age: 168h
      # BuildKit cache size threshold (Docker/Go byte size string, e.g.
      # "10g", "512MiB"). If usage exceeds this after the age-based prune,
      # an `until=0` prune runs as a fallback. Default when unset: 10g
      buildkit_cache_max_size: 10g
    resources:
      pids_limit: 128
      memory: 2g
      cpus: 2.0
      workspace_size: 512m
      workspace_max_files: 10000
    broker:
      image: ai-orchestra/meta-harness-broker:0.1.0
      port_range: [8790, 8990]
      idle_timeout_sec: 300
      startup_timeout_sec: 30
      max_requests: 64
      max_total_tokens: 500000
      max_upstream_bytes: 50000000
      pricing_upper_bound_usd_per_million:
        # Issue #261 PR2: Sonnet 単価上限に再較正（1h cache write 上限込み）。旧値は Opus 単価だった
        input: 3.0
        output: 15.0
        cache_creation: 6.0
        cache_read: 0.30
      # Issue #261 PR2: broker が request body の model を検証する human-curated allowlist（fail-closed）。
      # evaluate.model / judge.model が同一値に pin されているため 1 値のみで両方をカバーする
      model_allowlist:
        - claude-sonnet-5
scenario_run:
  max_turns_default: 30
  max_budget_usd_default: 3.0 # 2026-07-07 スパイク実測反映（Sec14）。実測 total_cost_usd=1.20 に余裕を持たせる
  max_output_tokens_default: 4096
regression:
  enabled: true # false = skill target を専有 facet allowlist へ縮退
  max_affected_suites: 7
  # Issue #261 PR6: issue-fix suite の予算再較正（fix-greet-none-bug +3.0 /
  # fix-formal-greeting-feature-holdout repeat=3 で +9.0）で train+holdout 通算の必要予算が
  # 90.0 に増加したため 78.0 -> 90.0 に引き上げ。verify-routing-config の予算は routing-config
  # target 自身の own budget（別会計）でありこのプール計算には寄与しない。
  # Issue #261 PR7: bootstrap 最終検証で fix-greet-none-bug が 9 turns 目に $6.00 latch した
  # 実測を受け、issue-fix suite の予算を 6.0 -> 9.0 に再較正（fix-greet-none-bug +3.0 /
  # fix-formal-greeting-feature-holdout repeat=3 で +9.0）。90.0 -> 102.0 に引き上げ。
  # Issue #261 PR7 追補: 旧 baseline holdout 評価で create-bug-issue-holdout が 11 turns 目に
  # $3.00 latch した実測を受け、3.0 -> 6.0 に再較正（holdout repeat=3 で +9.0）。102.0 -> 111.0
  # に引き上げ。
  # Issue #261 PR8（最終較正）: 最終 evaluate で issue-create/issue-fix 4 シナリオ全てが latch
  # した実測（create-task-issue train +12・create-bug-issue-holdout +27・fix-greet-none-bug
  # train +6・fix-formal-greeting-feature-holdout +18、計 +63）を受け、$3→$6→$9 の逐次追随を
  # 打ち切り 4 シナリオとも $15.00 に最終設定した。111.0 -> 174.0 に引き上げ。再計算根拠は
  # test_default_budget_covers_all_registered_routing_config_regression_suites を参照
  max_budget_usd: 174.0 # 全登録 skill (6件) + claude-harness の現行 suite を train/holdout 通算で収容
judge:
  tool: claude-bare # tool-less judge。codexはread deny不能のため無効（ADR-20260711-034）
  model: claude-sonnet-5 # Issue #261 PR2: bare judge smoke/実行も Opus 既定にしない（evaluate.model と同値に pin）
  effort: high
  max_turns: 4
scoring:
  critical_weight: 70
  penalty_base: 30
  penalty_per_item: 5
  penalty_missing_report: 6
frontier:
  cost_axis: total_cost_usd
overlay:
  allowed_prefixes:
    - "facets/"
  denied_prefixes:
    - "packages/meta-harness/"
    - ".claude/meta-harness/"
    - "docs/evaluation/"
    - ".github/"
config_patch:
  # 実効 allowlist はコード定数 CONFIG_PATCH_ALLOWLIST_CEILING の部分集合に限定
  allowlist:
    - "agent-routing/cli-tools.yaml#agents.*.tool"
    - "agent-routing/cli-tools.yaml#codex.model"
    - "agent-routing/cli-tools.yaml#antigravity.model"
  # proposer routing-config 候補の reject / overfit retire 後に待つ loop round 数
  proposer_cooldown_rounds: 3
proposer:
  tool: codex # codex | claude-bare（Sec11-3-5）。利用不能時は fail-closed（暗黙フォールバック禁止）
  max_iterations: 10
  divergence_rounds: 3
  overfit_drop_pt: 15
  budget_usd_per_iteration: 1.0 # 実測待ち。§14 参照
  max_turns: 40
  timeout_seconds: 600 # codex backend の wall-clock timeout（秒）。超過時は fail-closed
  max_focus_runs: 5
  max_overlay_bytes: 200000
  model: null # null = セッション既定モデル
  effort: high
  isolation:
    backend: srt # srt のみ（Phase 2 時点）。利用不能時は fail-closed（Sec11-3-2）
    srt_version_pin: null # null = pin なし。設定時は srt --version と厳密一致
    allow_read_extra: [] # CLI 起動に必要な追加 allowRead。store/holdout/facets 等は静的検査で拒否
loop:
  budget_usd: null # 実測後に既定を設定。§14 参照
  quality_epsilon_pt: 0.5 # best_quality の改善判定閾値（§13-2）
  convergence:
    enabled: true
    quality_band_pt: 3
    rounds: 2
promote:
  verify_command: null # 例: "pytest -q"。null = 検証コマンドを実行しない
  allow_stale: false # true にすると鮮度チェック（§12-1）を警告に緩和
  reservation_ttl_hours: 24 # promotion_reserved の stale 判定閾値（§12-2）
locks:
  store_ttl_seconds: 60
  evaluate_heartbeat_seconds: 60
  evaluate_stale_seconds: 300
retention:
  keep_generations: 5

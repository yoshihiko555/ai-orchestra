description: コード・テスト・コミットログ・コードコメントの書き分け

# フロントマター（生成される SKILL.md に付与）
frontmatter:
  name: code-comments
  description: |
    Use when deciding what to write in code, tests, commit logs, or code comments.
    Code should express How, tests should express What, commit logs should express Why,
    and code comments should express Why not. Use during implementation and when writing
    commit messages or PR descriptions. Also trigger on "comments", "コメント", "commit message",
    "コミットメッセージ", "PR description", "テスト名", "why not".
  metadata:
    short-description: Decide what belongs in code vs tests vs commit logs vs code comments


version: "3"

vars:
  ORCHESTRA_DIR: $HOME/ghq/github.com/yoshihiko555/ai-orchestra

includes:
  list:
    taskfile: ./taskfiles/list.yml
    flatten: true
    vars:
      ORCHESTRA_DIR: "{{.ORCHESTRA_DIR}}"
  kpi:
    taskfile: ./taskfiles/kpi.yml
    flatten: true
    vars:
      ORCHESTRA_DIR: "{{.ORCHESTRA_DIR}}"
  rel:
    taskfile: ~/ghq/github.com/yoshihiko555/.github/taskfiles/release.yml
    flatten: true
    vars:
      # ADR-020: stage 経由フローを採用。release/* を stage と main の両方に並列 PR で出す
      STAGE_BRANCH: stage
